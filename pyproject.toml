[tool.ruff]
target-version = "py310"
line-length = 100
force-exclude = true
extend-exclude = ["open", "data", "datasets", "outputs", "runs", "logs", "checkpoints", "artifacts", "weights", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
norecursedirs = ["open", "data", "datasets", "outputs", "runs", "logs", "checkpoints", "artifacts", "weights", ".venv", "venv"]
